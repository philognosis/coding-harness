<svg xmlns="http://www.w3.org/2000/svg" width="760" height="668" viewBox="0 0 760 668" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Coding harness: six-layer architecture</title>
<rect width="760" height="668" rx="16" fill="#FFFFFF"/>
<text x="40" y="44" font-size="20" font-weight="600" fill="#2C2C2A">The coding harness</text>
<text x="40" y="66" font-size="13" fill="#5F5E5A">Six layers. Knowledge flows down into code; checks push mistakes back up to the agent.</text>
<rect x="40" y="88" width="680" height="80" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="60" y="122" font-size="15" font-weight="600" fill="#444441">1 · You</text>
<text x="60" y="142" font-size="12" fill="#5F5E5A">Approve and merge</text>
<rect x="226" y="102" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
<text x="301.0" y="133" font-size="13.5" font-weight="600" fill="#444441" text-anchor="middle">Approve spec</text>
<rect x="388" y="102" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
<text x="463.0" y="133" font-size="13.5" font-weight="600" fill="#444441" text-anchor="middle">Confirm diagram</text>
<rect x="550" y="102" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
<text x="625.0" y="133" font-size="13.5" font-weight="600" fill="#444441" text-anchor="middle">Approve plan</text>
<path d="M140 169 L140 177" stroke="#888780" stroke-width="1.2"/><path d="M136 174 L140 178 L144 174" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="178" width="680" height="80" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="60" y="212" font-size="15" font-weight="600" fill="#3C3489">2 · Agents</text>
<text x="60" y="232" font-size="12" fill="#534AB7">Claude Code, Cursor</text>
<rect x="226" y="192" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="1"/>
<text x="301.0" y="215" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Builder</text>
<text x="301.0" y="233" font-size="11.5" fill="#534AB7" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">main session</text>
<rect x="388" y="192" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="1"/>
<text x="463.0" y="215" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Reviewer</text>
<text x="463.0" y="233" font-size="11.5" fill="#534AB7" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">fresh context</text>
<rect x="550" y="192" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#CECBF6" stroke-width="1"/>
<text x="625.0" y="215" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Researcher</text>
<text x="625.0" y="233" font-size="11.5" fill="#534AB7" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">primary sources</text>
<path d="M140 259 L140 267" stroke="#888780" stroke-width="1.2"/><path d="M136 264 L140 268 L144 264" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="268" width="680" height="80" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="60" y="302" font-size="15" font-weight="600" fill="#085041">3 · Loop</text>
<text x="60" y="322" font-size="12" fill="#0F6E56">Skills as /commands</text>
<rect x="226" y="282" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="1"/>
<text x="301.0" y="305" font-size="13.5" font-weight="600" fill="#085041" text-anchor="middle">Understand</text>
<text x="301.0" y="323" font-size="11.5" fill="#0F6E56" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">/frame /ingest</text>
<rect x="388" y="282" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="1"/>
<text x="463.0" y="305" font-size="13.5" font-weight="600" fill="#085041" text-anchor="middle">Design</text>
<text x="463.0" y="323" font-size="11.5" fill="#0F6E56" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">/model /blueprint</text>
<rect x="550" y="282" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="1"/>
<text x="625.0" y="305" font-size="13.5" font-weight="600" fill="#085041" text-anchor="middle">Ship</text>
<text x="625.0" y="323" font-size="11.5" fill="#0F6E56" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">/build /gate /wrap</text>
<path d="M140 349 L140 357" stroke="#888780" stroke-width="1.2"/><path d="M136 354 L140 358 L144 354" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="358" width="680" height="80" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="60" y="392" font-size="15" font-weight="600" fill="#712B13">4 · Guardrails</text>
<text x="60" y="412" font-size="12" fill="#993C1D">Guarantees, not advice</text>
<rect x="226" y="372" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="1"/>
<text x="301.0" y="395" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Permissions</text>
<text x="301.0" y="413" font-size="11.5" fill="#993C1D" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">settings.json</text>
<rect x="388" y="372" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="1"/>
<text x="463.0" y="395" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Hooks</text>
<text x="463.0" y="413" font-size="11.5" fill="#993C1D" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">exit 2 blocks</text>
<rect x="550" y="372" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="1"/>
<text x="625.0" y="395" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Checks</text>
<text x="625.0" y="413" font-size="11.5" fill="#993C1D" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">check.sh, CI</text>
<path d="M140 439 L140 447" stroke="#888780" stroke-width="1.2"/><path d="M136 444 L140 448 L144 444" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="448" width="680" height="80" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="60" y="482" font-size="15" font-weight="600" fill="#633806">5 · Knowledge</text>
<text x="60" y="502" font-size="12" fill="#854F0B">Files in git, no DB</text>
<rect x="226" y="462" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#FAC775" stroke-width="1"/>
<text x="301.0" y="485" font-size="13.5" font-weight="600" fill="#633806" text-anchor="middle">Intent</text>
<text x="301.0" y="503" font-size="11.5" fill="#854F0B" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">goals, ADRs, specs</text>
<rect x="388" y="462" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#FAC775" stroke-width="1"/>
<text x="463.0" y="485" font-size="13.5" font-weight="600" fill="#633806" text-anchor="middle">Generated</text>
<text x="463.0" y="503" font-size="11.5" fill="#854F0B" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">CODEMAP.md</text>
<rect x="550" y="462" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#FAC775" stroke-width="1"/>
<text x="625.0" y="485" font-size="13.5" font-weight="600" fill="#633806" text-anchor="middle">Rules</text>
<text x="625.0" y="503" font-size="11.5" fill="#854F0B" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">AGENTS.md, lint</text>
<path d="M140 529 L140 537" stroke="#888780" stroke-width="1.2"/><path d="M136 534 L140 538 L144 534" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="40" y="538" width="680" height="80" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="60" y="572" font-size="15" font-weight="600" fill="#0C447C">6 · Code</text>
<text x="60" y="592" font-size="12" fill="#185FA5">Structure first</text>
<rect x="226" y="552" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="1"/>
<text x="301.0" y="575" font-size="13.5" font-weight="600" fill="#0C447C" text-anchor="middle">Types</text>
<text x="301.0" y="593" font-size="11.5" fill="#185FA5" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">enums, unions</text>
<rect x="388" y="552" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="1"/>
<text x="463.0" y="575" font-size="13.5" font-weight="600" fill="#0C447C" text-anchor="middle">State machines</text>
<text x="463.0" y="593" font-size="11.5" fill="#185FA5" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">TRANSITIONS table</text>
<rect x="550" y="552" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="1"/>
<text x="625.0" y="575" font-size="13.5" font-weight="600" fill="#0C447C" text-anchor="middle">Tests and evals</text>
<text x="625.0" y="593" font-size="11.5" fill="#185FA5" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">golden eval set</text>
<text x="40" y="644" font-size="11.5" fill="#888780">No database: every artifact the harness uses is a plain file under version control.</text>
</svg>