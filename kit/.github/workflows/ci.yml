# The same check the agent runs locally. If it passes here, "done" was true.
# Pin the action versions to the current releases when you adopt this file.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agent config is in sync
        run: python3 scripts/sync_agent_config.py --check

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install ast-grep
        run: uv tool install ast-grep-cli

      - name: Verify
        run: bash scripts/check.sh
